<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Bode Creative Bali</title>
    <meta name="description" content="Get in touch with Bode Creative for marketing and operational support in Bali.">
    <link rel="canonical" href="https://bodecreative.com/contact">
    
    <meta property="og:title" content="Contact | Bode Creative">
    <meta property="og:description" content="Start working with our embedded team today.">
    <meta property="og:image" content="assets/og-image.jpg">
    <meta property="og:url" content="https://bodecreative.com/contact">
    <meta property="og:type" content="website">
    
    <meta name="twitter:card" content="summary_large_image">
    
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/contact.css">
    
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "ContactPage",
        "name": "Contact Bode Creative",
        "url": "https://bodecreative.com/contact"
    }
    </script>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'GA_MEASUREMENT_ID');
    </script>
    
    <script>
        !function(f,b,e,v,n,t,s)
        {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
        n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)}(window, document,'script',
        'https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', 'PIXEL_ID');
        fbq('track', 'PageView');
    </script>
</head>
<body>
    <nav class="kepala-navigasi-contact">
        <div class="wadah-menu">
            <a href="/" class="item-menu">Home</a>
            <div class="wadah-dropdown">
                <span class="tombol-dropdown">Best at:</span>
                <div class="isi-dropdown">
                    <a href="/best-at/marketing-social-media" class="item-dropdown">Marketing & Social Media</a>
                    <a href="/best-at/digital-web" class="item-dropdown">Digital & Web</a>
                    <a href="/best-at/creative-production" class="item-dropdown">Creative Production</a>
                    <a href="/best-at/operational-business-support" class="item-dropdown">Operational & Business Support</a>
                </div>
            </div>
            <a href="/about" class="item-menu">About</a>
            <a href="/contact" class="item-menu aktif">Contact</a>
        </div>
    </nav>

    <section class="bagian-judul-contact">
        <h1 class="judul-besar-contact">Let's Work</h1>
    </section>

    <main class="wadah-utama-contact">
        <div class="wadah-form-contact">
            <form class="form-brutalis" id="formKontak" action="/submit" method="POST">
                <div class="grup-input">
                    <label for="nama" class="label-input">NAME</label>
                    <input type="text" id="nama" name="nama" class="input-teks" required>
                </div>
                
                <div class="grup-input">
                    <label for="email" class="label-input">EMAIL</label>
                    <input type="email" id="email" name="email" class="input-teks" required>
                </div>
                
                <div class="grup-input">
                    <label for="whatsapp" class="label-input">WHATSAPP</label>
                    <input type="tel" id="whatsapp" name="whatsapp" class="input-teks" required>
                </div>
                
                <div class="grup-input">
                    <label class="label-input">SERVICES</label>
                    <div class="wadah-pilih-layanan">
                        <label class="kotak-centang">
                            <input type="checkbox" name="layanan[]" value="marketing" class="input-centang">
                            <span class="teks-centang">Marketing & Social Media</span>
                        </label>
                        <label class="kotak-centang">
                            <input type="checkbox" name="layanan[]" value="digital" class="input-centang">
                            <span class="teks-centang">Digital & Web</span>
                        </label>
                        <label class="kotak-centang">
                            <input type="checkbox" name="layanan[]" value="creative" class="input-centang">
                            <span class="teks-centang">Creative Production</span>
                        </label>
                        <label class="kotak-centang">
                            <input type="checkbox" name="layanan[]" value="operational" class="input-centang">
                            <span class="teks-centang">Operational & Business Support</span>
                        </label>
                    </div>
                </div>
                
                <div class="grup-input">
                    <label for="pesan" class="label-input">MESSAGE</label>
                    <textarea id="pesan" name="pesan" class="input-teks-area" rows="5" required></textarea>
                </div>
                
                <div class="wadah-tombol">
                    <button type="submit" class="tombol-kirim" id="tombolKirim">SEND</button>
                    <a href="https://wa.me/6281234567890" target="_blank" rel="noopener" class="tombol-wa" id="tombolWA">WhatsApp</a>
                </div>
            </form>
        </div>
        
        <div class="wadah-info-sebar">
            <div class="info-sudut kiri-atas">
                <span class="label-info">EMAIL</span>
                <a href="mailto:hello@bodecreative.com" class="nilai-info">hello@bodecreative.com</a>
            </div>
            <div class="info-sudut kanan-atas">
                <span class="label-info">LOCATION</span>
                <span class="nilai-info">Bali, Indonesia</span>
            </div>
            <div class="info-sudut kiri-bawah">
                <span class="label-info">CAPACITY</span>
                <span class="nilai-info">Limited slots available</span>
            </div>
            <div class="info-sudut kanan-bawah">
                <span class="label-info">RESPONSE</span>
                <span class="nilai-info">Within 48 hours</span>
            </div>
        </div>
        
        <aside class="bilah-sosial">
            <a href="https://instagram.com/placeholder" target="_blank" rel="noopener" class="link-sosial-besar">IG</a>
            <a href="https://tiktok.com/@placeholder" target="_blank" rel="noopener" class="link-sosial-besar">TT</a>
            <a href="https://facebook.com/placeholder" target="_blank" rel="noopener" class="link-sosial-besar">FB</a>
            <a href="https://youtube.com/@placeholder" target="_blank" rel="noopener" class="link-sosial-besar">YT</a>
        </aside>
    </main>
    
    <section class="bagian-peta">
        <img src="assets/villa rosita beach with local fisherman fishing at the edge of a concrete platform against raging morning ocean waves depicting calmness within the foaming wave.webp" alt="Bali location map" class="gambar-peta">
    </section>

    <footer class="kaki-contact">
        <div class="wadah-kaki">
            <div class="logowadah">
                <img src="assets/Bode logo.webp" alt="Bode Creative" class="logogambar">
            </div>
            <div class="wadah-link-kaki">
                <a href="/" class="link-kaki">Home</a>
                <a href="/about" class="link-kaki">About</a>
                <a href="/contact" class="link-kaki">Contact</a>
            </div>
        </div>
    </footer>

    <script src="scripts/contact.js"></script>
</body>
</html>
